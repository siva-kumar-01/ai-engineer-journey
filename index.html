<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Engineer Journey</title>
<meta name="description" content="Track your 32-week roadmap from SAP to AI Engineer.">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1525" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2316213A' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23E2A21B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --paper:#EEF1F5; --surface:#FFFFFF; --surface-2:#F6F8FA;
  --ink:#16213A; --ink-2:#4A5672; --ink-3:#7B869C;
  --line:#D6DCE5; --line-2:#E4E8EE;
  --accent:#E2A21B; --accent-ink:#875800; --accent-soft:#FCEFCB;
  --check:#16213A; --check-mark:#FFFFFF;
  --heat-0:#DFE4EC; --heat-1:rgba(22,33,58,.22); --heat-2:rgba(22,33,58,.42); --heat-3:rgba(22,33,58,.66); --heat-4:rgba(22,33,58,.92);
  --t-dsa:#5560D8; --t-swe:#1D8677; --t-cs:#8A57C4; --t-ai:#C98500; --t-proj:#C23B6E; --t-career:#3D7A39;
  --ok:#1D8677; --warn:#C23B6E;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0E1525; --surface:#151F33; --surface-2:#1A263D;
    --ink:#E6EBF4; --ink-2:#A8B3C8; --ink-3:#7E8AA2;
    --line:#28344D; --line-2:#212C42;
    --accent:#F0B43C; --accent-ink:#F0B43C; --accent-soft:#3A2F14;
    --check:#E6EBF4; --check-mark:#0E1525;
    --heat-0:#1C2740; --heat-1:rgba(230,235,244,.2); --heat-2:rgba(230,235,244,.4); --heat-3:rgba(230,235,244,.64); --heat-4:rgba(230,235,244,.9);
    --t-dsa:#8E97F2; --t-swe:#4CC0AE; --t-cs:#B78FEC; --t-ai:#F0B43C; --t-proj:#EE7DA6; --t-career:#80C47B;
    --ok:#4CC0AE; --warn:#EE7DA6;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
a{color:inherit}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{left:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header */
.top{padding-top:26px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.status{font-size:15px;color:var(--ink-2);margin-top:3px}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;text-decoration:none;white-space:nowrap}
.sync:hover{border-color:var(--ink-3)}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sync[data-s="synced"] .dot{background:var(--ok)}
.sync[data-s="syncing"] .dot,.sync[data-s="connecting"] .dot{background:var(--accent);animation:blink 1s ease-in-out infinite}
.sync[data-s="error"] .dot,.sync[data-s="offline"] .dot{background:var(--warn)}
.sync[data-s="preview"] .dot{background:var(--accent)}
@keyframes blink{50%{opacity:.3}}
.banner{margin-top:16px;background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:14px}
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:10px 12px;text-decoration:none;color:var(--ink-2);font-size:15px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
main.wrap{padding:30px 24px 72px;outline:none}

/* Type */
h1,h2,h3{margin:0;line-height:1.2}
.week-head{font-size:clamp(28px,4.2vw,40px);letter-spacing:-.02em;margin:30px 0 8px;max-width:26ch}
.page-h{font-size:clamp(26px,3.6vw,34px);letter-spacing:-.015em;margin:0 0 8px}
.week-sub{color:var(--ink-2);margin:0 0 14px;max-width:70ch}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.empty{color:var(--ink-2);padding:18px 0;border-top:1px solid var(--line)}

/* Journey line */
.journey{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.mg{flex:var(--w) 1 0;min-width:calc(var(--w) * 27px + 16px)}
.mg-head{font-size:13px;color:var(--ink-3);line-height:1.3;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-head b{display:block;color:var(--ink-2);font-weight:700}
.mg-track{display:flex;align-items:flex-start;position:relative}
.mg-track::before{content:"";position:absolute;left:12px;right:12px;top:16px;height:2px;background:var(--line)}
.node{flex:1;min-width:27px;display:grid;grid-template-rows:34px auto;justify-items:center;align-items:center;position:relative;z-index:1;text-decoration:none;border-radius:8px;padding-bottom:2px}
.node i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3);background:conic-gradient(var(--ink) calc(var(--p) * 1%), var(--surface) 0)}
.node.done i{background:var(--ink);border-color:var(--ink)}
.node.current i{width:22px;height:22px;box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--accent)}
.node:hover i{border-color:var(--ink)}
.node small{font-size:11px;line-height:1;color:var(--ink-3);font-variant-numeric:tabular-nums}
.node.current small{color:var(--accent-ink);font-weight:700}
.node.pop i{animation:pop .7s ease}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.45)}100%{transform:scale(1)}}
.flag{flex:none;align-self:flex-start;width:13px;height:13px;transform:rotate(45deg);border:2px solid var(--ink-3);background:var(--surface);margin:10px 4px 0 6px;position:relative;z-index:1}
.flag.done{background:var(--accent);border-color:var(--accent)}
.here{font-size:14px;color:var(--ink-2);margin-top:6px}
.here b{color:var(--accent-ink)}

/* Progress meter */
.meter{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.meter>span{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width .45s ease}
.meter.thin{height:6px}

/* Layout */
.dash{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:44px;margin-top:30px;align-items:start}
.lower{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:44px;margin-top:48px;align-items:start}
.stack>*+*{margin-top:28px}
@media (max-width:880px){.dash,.lower{grid-template-columns:1fr;gap:32px}}

/* Tasks */
.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.task{padding:14px 0;border-bottom:1px solid var(--line)}
.task-main{display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.task-chk{position:absolute;left:0;top:2px;width:20px;height:20px;margin:0;opacity:0;cursor:pointer}
.box{flex:none;width:20px;height:20px;border:2px solid var(--ink-3);border-radius:6px;margin-top:2px;display:grid;place-items:center;transition:background-color .15s,border-color .15s}
.task-main:hover .box{border-color:var(--ink)}
.task-chk:checked+.box{background:var(--check);border-color:var(--check)}
.task-chk:checked+.box::after{content:"";width:10px;height:5px;border-left:2px solid var(--check-mark);border-bottom:2px solid var(--check-mark);transform:translateY(-1px) rotate(-45deg)}
.task-chk:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.task-text{display:block;min-width:0}
.task-title{display:block}
.is-done .task-title{color:var(--ink-2)}
.task-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--ink-3);margin-top:3px}
.track{display:inline-flex;align-items:center;gap:6px}
.track::before,.dot{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc)}
.t-dsa{--tc:var(--t-dsa)}.t-swe{--tc:var(--t-swe)}.t-cs{--tc:var(--t-cs)}.t-ai{--tc:var(--t-ai)}.t-proj{--tc:var(--t-proj)}.t-career{--tc:var(--t-career)}
.opt{border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:1.5}
.tip{display:block;font-size:14px;color:var(--ink-2);margin-top:5px}
.res{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 32px}
.chip{display:inline-flex;align-items:baseline;gap:6px;font-size:13.5px;line-height:1.35;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;max-width:100%}
.chip:hover{border-color:var(--ink-3)}
.chip .kind{font-size:12px;color:var(--ink-3);flex:none}
.chip.primary{border-color:var(--accent);background:var(--accent-soft)}
.chip .start{font-size:12px;font-weight:700;color:var(--accent-ink);flex:none}
.group+.group{margin-top:30px}
.group-h{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink-2);margin-bottom:8px}
.more{display:inline-block;margin-top:16px;font-size:15px}

/* Panel and stats */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel h2{margin-bottom:6px}
.panel .muted{font-size:14px;margin-bottom:14px}
.stats{margin-top:20px}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line-2)}
.stat span{color:var(--ink-2);font-size:14.5px}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.stat small{grid-column:1/-1;color:var(--ink-3);font-size:13px}
.stat .meter{grid-column:1/-1;margin-top:6px}
.nudge{font-size:15px;color:var(--ink-2);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-top:18px}

/* Forms */
.field{display:grid;gap:6px;margin-bottom:14px;font-size:14px;color:var(--ink-2)}
input[type="text"],input[type="number"],input[type="date"],input[type="email"],input[type="password"],input[type="url"],input[type="search"],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.q,.filter{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.q:hover,.filter:hover{border-color:var(--ink-3)}
.q.on,.filter.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.check-field{display:flex;gap:10px;align-items:center;font-size:15px;margin:2px 0 16px;cursor:pointer}
.check-field input{width:18px;height:18px;accent-color:var(--ink)}
.btn{display:inline-block;font:inherit;font-size:15px;font-weight:700;text-decoration:none;border-radius:10px;padding:9px 16px;border:1px solid var(--ink);cursor:pointer;background:transparent;color:var(--ink);line-height:1.3}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn.quiet:hover{border-color:var(--ink-3)}
.btn.danger{border-color:var(--warn);color:var(--warn);font-weight:400}
.btn.sm{font-size:14px;padding:6px 11px}
.btn[aria-disabled="true"]{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.err{color:var(--warn)}

/* Decisions note */
.note-card{border:1.5px dashed var(--ink-3);border-radius:12px;padding:18px 20px}
.note-card dl{margin:12px 0 0;display:grid;gap:10px}
.note-card dt{font-size:13px;color:var(--ink-3)}
.note-card dd{margin:0;font-size:15px}
.note-card p{font-size:14px;color:var(--ink-2)}

/* Heatmap */
.heat{display:flex;gap:3px;overflow-x:auto;padding:3px 3px 6px}
.hcol{display:grid;grid-template-rows:repeat(7,13px);gap:3px}
.hc{width:13px;height:13px;border-radius:3px;background:var(--heat-0)}
.hc.l1{background:var(--heat-1)}.hc.l2{background:var(--heat-2)}.hc.l3{background:var(--heat-3)}.hc.l4{background:var(--heat-4)}
.hc.future{opacity:.4}
.hc.today{outline:2px solid var(--accent);outline-offset:1px}
.legend{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-3);margin-top:10px}
.legend .hc{display:inline-block}
.legend .hc:first-of-type{margin-left:4px}
.legend .end{margin-left:4px}

/* Bar chart */
.plot{position:relative;height:130px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line)}
.plot .tline{position:absolute;left:0;right:0;bottom:var(--t);border-top:2px dashed var(--accent);pointer-events:none}
.bar{flex:1;max-width:38px;margin:0 auto;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.bar.cur{background:var(--accent)}
.xlab{display:flex;gap:10px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:12.5px;color:var(--ink-3)}
.chart-note{font-size:13px;color:var(--ink-3);margin-top:8px}

/* Roadmap */
.rules{margin:24px 0 8px;padding:0 0 0 18px;color:var(--ink-2);max-width:72ch}
.rules li+li{margin-top:4px}
.month{padding:32px 0 8px;border-top:1px solid var(--line);margin-top:28px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.month-h h2{font-size:23px;letter-spacing:-.01em;margin:0}
.goal{color:var(--ink-2);margin:6px 0 14px;max-width:70ch}
.weeks{list-style:none;margin:18px 0 0;padding:0}
.wk{display:grid;grid-template-columns:78px 1fr 54px;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line-2);text-decoration:none}
.wk:hover{background:var(--surface-2)}
.wk .n{color:var(--ink-3);font-size:14px}
.wk .c{text-align:right;color:var(--ink-2);font-size:14px;font-variant-numeric:tabular-nums}
.wk.cur .n{color:var(--accent-ink);font-weight:700}
.wk em{font-style:normal;color:var(--accent-ink);font-size:14px}
.wk.full .c{color:var(--ink);font-weight:700}
.cp-h{font-size:15px;color:var(--ink-2);margin:24px 0 8px}

/* Week page */
.week-nav{display:flex;flex-wrap:wrap;gap:8px}
.week-log{font-size:14px;color:var(--ink-2);margin-top:16px}

/* Log */
.logs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.log{display:grid;grid-template-columns:120px 1fr auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2);align-items:start}
.log .d{font-weight:700;font-size:15px}
.log .b{font-size:15px;color:var(--ink-2)}
.log .n{display:block;color:var(--ink);margin-top:2px}
.log .acts{display:flex;gap:6px}
@media (max-width:560px){.log{grid-template-columns:1fr}.log .acts{justify-content:flex-start}}

/* Resources */
.search{max-width:420px;margin-top:16px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.res-group{margin-top:30px}
.res-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.res-item{padding:12px 0;border-bottom:1px solid var(--line-2)}
.res-item a{font-weight:700;text-decoration:none}
.res-item a:hover{text-decoration:underline}
.res-item p{font-size:14px;color:var(--ink-2);margin-top:2px}

/* Settings */
.settings{display:grid;gap:28px;max-width:760px;margin-top:22px}
.steps{margin:4px 0 16px;padding-left:20px;color:var(--ink-2);font-size:15px}
.steps li+li{margin-top:4px}
code{font-size:.92em;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:0 5px}

/* Login */
body.locked .tabs,body.locked .sync{display:none}
.login{max-width:460px;margin-top:12px}
.login .panel{margin-top:8px}
.login-links{display:flex;flex-direction:column;align-items:flex-start;gap:10px;margin-top:18px;font-size:15px}
.banner a{color:inherit;font-weight:700}

/* Onboarding */
.onboard{max-width:620px}
.onboard .lead{font-size:18px;color:var(--ink-2);margin:0 0 24px;max-width:60ch}

/* Toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:10px;font-size:15px;transition:opacity .25s,transform .25s;pointer-events:none;z-index:30;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .wrap{padding:0 16px} main.wrap{padding:24px 16px 64px}
  .res{margin-left:0}
  .wk{grid-template-columns:64px 1fr 44px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top wrap">
  <div class="top-row">
    <div>
      <p class="brand">AI Engineer Journey</p>
      <p class="status" id="status"></p>
    </div>
    <a class="sync" id="sync" href="#/settings" data-s="local"><span class="dot" aria-hidden="true"></span><span class="t">Saved on this device</span></a>
  </div>
  <div id="banner"></div>
  <nav class="tabs" aria-label="Main">
    <a href="#/" data-route="dashboard">Dashboard</a>
    <a href="#/week" data-route="week">This week</a>
    <a href="#/roadmap" data-route="roadmap">Roadmap</a>
    <a href="#/path" data-route="path">Learning path</a>
    <a href="#/log" data-route="log">Daily log</a>
    <a href="#/resources" data-route="resources">Resources</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>
</header>
<main id="main" class="wrap" tabindex="-1"></main>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =====================================================================
   AI Engineer Journey: roadmap data
   - Edit links in RES if one ever breaks.
   - Keep task ids (like "w3-2") unchanged: your saved progress uses them.
   - To add a task, append it to a week's list with a new id.
   ===================================================================== */

/* Optional: paste your Supabase project URL and anon (publishable) key here
   so sync works on every device without typing them in Settings.
   The anon key is designed to be public; Row Level Security protects your data. */
const CLOUD_CONFIG = { url: "https://ohbsurbiwepcrqagmzzg.supabase.co", key: "sb_publishable_0eSGb8VngklzP1xn379QeA_fz8KcozD" };

const TOTAL_WEEKS = 32;

const TRACKS = {
  dsa:    { name: "DSA" },
  swe:    { name: "Software engineering" },
  cs:     { name: "CS fundamentals" },
  ai:     { name: "AI engineering" },
  proj:   { name: "Projects" },
  career: { name: "Career" }
};
const TRACK_ORDER = ["dsa", "swe", "cs", "ai", "proj", "career"];

const AREAS = [
  { id: "dsa",    name: "DSA" },
  { id: "swe",    name: "Python and backend" },
  { id: "cs",     name: "CS fundamentals" },
  { id: "sd",     name: "System design" },
  { id: "ai",     name: "AI engineering" },
  { id: "proj",   name: "Project tools" },
  { id: "career", name: "Career and certifications" },
  { id: "news",   name: "Staying current" }
];

const R  = (t, u, k, a, s) => ({ t, u, k, a, s });
const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

function defaultState() {

/* ---------- Plan maths ---------- */
const TASK_WEEK = {}; const CP_MONTH = {};
function buildIndex() {

  MONTHS.forEach(m => m.checkpoints.forEach(([id]) => { CP_MONTH[id] = m; }));
}
function planWeekOf(dateStr) {

}
const currentWeek = () => Math.min(planWeekOf(todayStr()), TOTAL_WEEKS + 1); // 0 = not started, 27 = finished
const clampWeek = w => clamp(w, 1, TOTAL_WEEKS);

function weekStats(w) {
  const ts = WEEKS[w - 1].tasks.filter(t => !t.opt);
  const done = ts.filter(t => state.tasks[t.id]).length;
  return { done, total: ts.length, pct: ts.length ? done / ts.length : 0 };
}
function monthStats(m) {

  m.weeks.forEach(w => { const s = weekStats(w); done += s.done; total += s.total; });
  m.checkpoints.forEach(([id]) => { total++; if (state.tasks[id]) done++; });
  return { done, total, pct: total ? done / total : 0 };
}
function overallStats() {
  let done = 0, total = 0;
  MONTHS.forEach(m => { const s = monthStats(m); done += s.done; total += s.total; });
  return { done, total, pct: total ? done / total : 0 };
}
const checkpointsDone = m => m.checkpoints.every(([id]) => state.tasks[id]);

/* ---------- Log maths ---------- */
const logActive = l => !!l && ((l.minutes || 0) > 0 || (l.dsa || 0) > 0 || !!l.min);
function streak() {
  let s = todayStr();
  if (!logActive(state.logs[s])) s = ymd(addDays(parseYmd(s), -1));
  let n = 0;
  while (logActive(state.logs[s])) { n++; s = ymd(addDays(parseYmd(s), -1)); }
  return n;
}
function bestStreak() {
  const days = Object.keys(state.logs).filter(d => logActive(state.logs[d])).sort();
  let best = 0, cur = 0, prev = null;
  for (const d of days) { cur = prev && dayDiff(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
  return best;
}
function weekLogStats(w) {
  if (!state.settings.start || w < 1 || w > TOTAL_WEEKS) return { minutes: 0, dsa: 0, days: 0 };
  const [a] = weekRange(w); let minutes = 0, dsa = 0, days = 0;
  for (let i = 0; i < 7; i++) {
    const l = state.logs[ymd(addDays(parseYmd(a), i))];
    if (l) { minutes += l.minutes || 0; dsa += l.dsa || 0; if (logActive(l)) days++; }
  }

}
const totalDsa = () => Object.values(state.logs).reduce((s, l) => s + (l.dsa || 0), 0) + (Number(state.settings.dsaOffset) || 0);

/* ---------- Mutations ---------- */
function setTask(id, done) {

  }

}
function saveLog(date, data) {

    dsa: clamp(parseInt(data.dsa, 10) || 0, 0, 200),

/* ---------- Cloud sync (Supabase) ---------- */
function loadScript(src) {

  if (/invalid login credentials/i.test(msg)) return "Email or password is incorrect.";
  if (/email not confirmed/i.test(msg)) return "Confirm your email using the link Supabase sent, then sign in.";
  if (/does not exist|could not find the table|schema cache/i.test(msg)) return "The tables weren't found. Run schema.sql in the Supabase SQL editor.";
  if (/invalid api key|jwt|apikey|no api key/i.test(msg)) return "The project key looks wrong. Copy the anon or publishable key again.";
  if (/user already registered/i.test(msg)) return "An account with this email already exists. Sign in instead.";
  if (/signups? not allowed|signup.*disabled/i.test(msg)) return "New sign-ups are turned off for this project. Sign in with your existing account.";
  if (/should be different/i.test(msg)) return "Choose a password that's different from your current one.";

/* Auto sign-out after inactivity (client-side; Supabase's server-side timeouts need a paid plan) */
const idleLabel = m => (IDLE_OPTIONS.find(([v]) => v === m) || [0, `${m} minutes`])[1];
const Idle = {
  _lastWrite: 0, _busy: false,
  minutes() { const v = Store.get(IDLE_KEY); return typeof v === "number" ? v : IDLE_DEFAULT; },
  setMinutes(m) { Store.set(IDLE_KEY, m); this.touch(true); },
  last() { return Number(Store.get(LAST_ACTIVE_KEY)) || 0; },
  expired() {

  },
  async check() {

const Cloud = {

  config() {

    return Store.get(CLOUD_KEY) || { url: "", key: "" };
  },
  configured() { const c = this.config(); return !!(c.url && c.key); },
  uid() { return this.session && this.session.user ? this.session.user.id : null; },
  setStatus(s, msg = "") {

  run(fn) { const p = this._lock.then(fn, fn); this._lock = p.catch(() => {}); return p; },

  async init() {

    } catch (e) { this.setStatus("error", friendlyError(e)); }

  },
  async signIn(email, password) {

  },
  async signUp(email, password) {

/* First sync on a device: keep everything from both sides, then upload what the cloud is missing. */

    state.settings = { ...state.settings, ...remote.settings };

  }
  for (const id of Object.keys(state.tasks)) if (remote.tasks[id] !== state.tasks[id]) push.push("task:" + id);
  for (const [d, l] of Object.entries(remote.logs)) {
    if (!state.logs[d] || newer(l.updated_at, state.logs[d].updated_at)) state.logs[d] = l;
  }
  for (const d of Object.keys(state.logs)) if (!remote.logs[d] || remote.logs[d] !== state.logs[d]) push.push("log:" + d);
  for (const [w, rv] of Object.entries(remote.reviews)) {
    if (!state.reviews[w] || newer(rv.updated_at, state.reviews[w].updated_at)) state.reviews[w] = rv;
  }
  for (const w of Object.keys(state.reviews)) if (!remote.reviews[w] || remote.reviews[w] !== state.reviews[w]) push.push("review:" + w);
  return push;
}

function setActiveNav(name) {

function isLocked() { return Store.persistent && Cloud.configured() && !Cloud.session && !ui.offline; }
function render() {

      <ul class="tasks">${m.checkpoints.map(cpHTML).join("")}</ul>
    </section>`;
  }).join("")}`;
}

function viewLog(arg) {
  const date = isYmd(arg) && arg <= todayStr() ? arg : todayStr();
  const entries = Object.entries(state.logs).sort((x, y) => y[0].localeCompare(x[0]));
  const totMin = entries.reduce((s, [, l]) => s + (l.minutes || 0), 0);
  const active = entries.filter(([, l]) => logActive(l)).length;
  return `
  <h1 class="page-h">Daily log</h1>
  <p class="week-sub">${fmtMin(totMin)} studied, ${totalDsa()} DSA problems and ${active} active days in total.</p>
  <div class="dash">
    <section aria-labelledby="hist-h">
      <h2 id="hist-h">History</h2>
      ${entries.length ? `<ul class="logs">${entries.map(([d, l]) => `<li class="log">
          <span class="d">${esc(fmtDateLong(d))}</span>
          <span class="b">${fmtMin(l.minutes)}, ${l.dsa || 0} ${(l.dsa || 0) === 1 ? "problem" : "problems"}${l.min ? ", minimum day" : ""}${l.note ? `<span class="n">${esc(l.note)}</span>` : ""}</span>
          <span class="acts"><a class="btn quiet sm" href="#/log/${d}">Edit</a><button type="button" class="btn quiet sm" data-act="del-log" data-date="${d}">Delete</button></span>
        </li>`).join("")}</ul>`
        : `<p class="empty">No logs yet. Log today's study time here; even a minimum day counts.</p>`}
    </section>
    <aside><div class="panel"><h2>${date === todayStr() ? "Log today" : "Edit " + esc(fmtDateLong(date))}</h2>${logFormHTML(date, false)}</div></aside>
  </div>`;
}

function viewPath() {
  const item = (k, main) => {
    const r = RES[k]; if (!r) return "";
    return `<li class="res-item"><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.t)}</a><p>${esc(r.k)}, ${esc(r.s)}${main ? "" : ". Extra"}</p></li>`;
  };
  return `
  <h1 class="page-h">Your AI engineering learning path</h1>
  <p class="week-sub">From zero AI knowledge to interview-ready, in order. Each step lists its main courses first, then extras for when you're stuck. Software engineering, DSA, system design and CS fundamentals run alongside these every week, in your <a href="#/roadmap">Roadmap</a>.</p>
  ${PATH.map((p, i) => `<section class="res-group">
    <h2>${i + 1}. ${esc(p.t)} <span class="muted small" style="font-weight:400">${esc(p.w)}</span></h2>
    <p class="muted" style="margin:0 0 10px;max-width:70ch">${esc(p.why)}</p>
    <ul class="res-list">${p.main.map(k => item(k, true)).join("")}</ul>
    ${p.extra.length ? `<details style="margin-top:8px"><summary class="muted small" style="cursor:pointer">Extras (${p.extra.length})</summary><ul class="res-list" style="margin-top:6px">${p.extra.map(k => item(k, false)).join("")}</ul></details>` : ""}
  </section>`).join("")}`;
}

function resourceUsage() {
  const used = {};
  WEEKS.forEach((wk, i) => wk.tasks.forEach(t => (t.r || []).forEach(k => { (used[k] = used[k] || new Set()).add(i + 1); })));
  return used;
}
function resListHTML() {
  const q = ui.resQuery.trim().toLowerCase(); const used = resourceUsage();
  const groups = AREAS.filter(a => ui.resArea === "all" || ui.resArea === a.id).map(a => ({
    a, items: Object.entries(RES).filter(([, r]) => r.a === a.id && (!q || `${r.t} ${r.s} ${r.k}`.toLowerCase().includes(q)))
  })).filter(g => g.items.length);
  if (!groups.length) return `<p class="empty">No resources match "${esc(ui.resQuery)}". Try a shorter word.</p>`;
  return groups.map(g => `<section class="res-group"><h2>${esc(g.a.name)}</h2><ul class="res-list">${g.items.map(([k, r]) => {
    const wks = used[k] ? [...used[k]].sort((x, y) => x - y) : [];
    return `<li class="res-item"><a href="${esc(r.u)}" target="_blank" rel="noopener noreferrer">${esc(r.t)}</a>
      <p>${esc(r.k)}, ${esc(r.s)}. ${wks.length ? `Used in week${wks.length > 1 ? "s" : ""} ${wks.join(", ")}.` : "Extra resource for when you want more."}</p></li>`;
  }).join("")}</ul></section>`).join("");
}
function viewResources() {
  return `
  <h1 class="page-h">Resources</h1>
  <p class="week-sub">Every link in the plan, in one place. Videos are usually free on DeepLearning.AI; certificates and some graded labs need PRO.</p>
  <div class="search"><label class="field"><span>Search resources</span><input type="search" id="res-q" value="${esc(ui.resQuery)}" placeholder="For example: RAG, FastAPI, graphs"></label></div>
  <div class="filters" role="group" aria-label="Filter by area">
    <button type="button" class="filter ${ui.resArea === "all" ? "on" : ""}" data-act="filter" data-area="all">All</button>
    ${AREAS.map(a => `<button type="button" class="filter ${ui.resArea === a.id ? "on" : ""}" data-act="filter" data-area="${a.id}">${esc(a.name)}</button>`).join("")}
  </div>
  <div id="res-list">${resListHTML()}</div>`;
}

function cloudSectionHTML() {
  const c = Cloud.config(); const fromFile = c.source === "file";
  if (!Store.persistent) return `<p class="muted">This preview can't save data or sync. Host the site (see the README) to use sync.</p>`;
  const setup = `
    <p class="muted" style="margin-bottom:10px">Login is off, so your progress lives in this browser only. Connect a free Supabase database to sign in with your email and password from any device.</p>
    <ol class="steps">
      <li>Create a free project at supabase.com.</li>
      <li>Open its SQL editor and run <code>supabase/schema.sql</code> from this site's files.</li>
      <li>From the project's API settings, copy the project URL and the anon (publishable) key, and paste them below.</li>
    </ol>`;
  if (!Cloud.configured() || (ui.showCloudForm && !fromFile)) {
    return `${setup}
    <form data-form="cloud">
      <label class="field"><span>Project URL</span><input type="url" name="url" required placeholder="https://your-project.supabase.co" value="${esc(fromFile ? "" : c.url)}"></label>
      <label class="field"><span>Anon or publishable key</span><input type="text" name="key" required autocomplete="off" spellcheck="false" value="${esc(fromFile ? "" : c.key)}"></label>
      <div class="row"><button class="btn primary" type="submit">Save and connect</button>${ui.showCloudForm ? `<button type="button" class="btn quiet" data-act="cancel-cloud">Cancel</button>` : ""}</div>
    </form>`;
  }
  const project = esc((c.url || "").replace(/^https?:\/\//, "").replace(/\/.*$/, ""));
  const changeLink = fromFile ? `<p class="muted small" style="margin-top:12px">Project ${project} is set in index.html (CLOUD_CONFIG).</p>`
    : `<p class="muted small" style="margin-top:12px">Project ${project}. <button type="button" class="linkbtn" data-act="edit-cloud">Change project</button> or <button type="button" class="linkbtn" data-act="disconnect">turn sync off</button>.</p>`;
  if (Cloud.status === "connecting") return `<p class="muted">Connecting to your project.</p>`;
  if (!Cloud.client) return `<p class="err">${esc(Cloud.message || "Sync isn't connected.")}</p><div class="row" style="margin-top:12px"><button type="button" class="btn quiet" data-act="retry-cloud">Try again</button></div>${changeLink}`;
  if (!Cloud.session) return `
    <p class="muted" style="margin-bottom:14px">Sign in with the same account on each device. Your progress on this device is kept and merged.</p>
    <form data-form="auth">
      <label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email"></label>
      <label class="field"><span>Password, at least 6 characters</span><input type="password" name="password" required minlength="6" autocomplete="current-password"></label>
      <div class="row"><button class="btn primary" type="submit" value="in">Sign in</button><button class="btn quiet" type="submit" value="up">Create account</button></div>
    </form>
    ${Cloud.message ? `<p class="err" style="margin-top:12px">${esc(Cloud.message)}</p>` : ""}
    ${changeLink}`;
  const pending = state.pending.length;
  return `
    <p>Signed in as <b>${esc(Cloud.session.user.email || "")}</b>.</p>
    <p class="muted small" style="margin-top:4px">${esc(SYNC_TEXT[Cloud.status] || "")}${pending ? `. ${pending} change${pending > 1 ? "s" : ""} waiting to upload.` : "."}${Cloud.message && Cloud.status !== "synced" ? " " + esc(Cloud.message) : ""}</p>
    <div class="row" style="margin-top:14px"><button type="button" class="btn primary" data-act="sync-now">Sync now</button><button type="button" class="btn quiet" data-act="sign-out">Sign out</button><button type="button" class="btn quiet" data-act="sign-out-all">Sign out everywhere</button></div>
    <p class="muted small" style="margin-top:10px">Sign out removes your progress from this device only; it stays safe in your database. Sign out everywhere also signs out every other device, which is useful if you lose a phone or used a shared computer.</p>
    <form data-form="idle" style="margin-top:22px">
      <label class="field"><span>Sign out automatically on this device after</span>
        <select name="idle">${IDLE_OPTIONS.map(([m, l]) => `<option value="${m}" ${m === Idle.minutes() ? "selected" : ""}>${m ? `${l} without activity` : "Never"}</option>`).join("")}</select>
      </label>
      <button class="btn quiet" type="submit">Save</button>
      <p class="muted small" style="margin-top:10px">Saved on this device only, so you can choose a shorter time on shared or office computers.</p>
    </form>
    <form data-form="changepass" style="margin-top:22px">
      <label class="field"><span>Change password, at least 8 characters</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn quiet" type="submit">Change password</button>
    </form>
    ${changeLink}`;
}
function viewSettings() {
  const s = state.settings;
  return `
  <h1 class="page-h">Settings</h1>
  <div class="settings">
    <section class="panel">
      <h2>Your plan</h2>
      <form data-form="settings">
        <label class="field"><span>Your name, optional</span><input type="text" name="name" value="${esc(s.name)}"></label>
        <label class="field"><span>Start date</span><input type="date" name="start" value="${esc(s.start || todayStr())}" required></label>
        <label class="field"><span>Weekly study target in hours</span><input type="number" name="target" min="1" max="80" value="${esc(s.target || 20)}"></label>
        <label class="field"><span>DSA problems you'd already solved before using this tracker</span><input type="number" name="dsaOffset" min="0" max="2000" value="${esc(s.dsaOffset || 0)}"></label>
        <button class="btn primary" type="submit">Save plan settings</button>
      </form>
    </section>
    <section class="panel">
      <h2>Login and sync</h2>
      ${cloudSectionHTML()}
    </section>
    <section class="panel">
      <h2>Backup</h2>
      <p class="muted">Download a copy of all your progress, or restore one. Good to do once a month.</p>
      <div class="row"><button type="button" class="btn quiet" data-act="export">Download backup</button><button type="button" class="btn quiet" data-act="import">Restore from backup</button><button type="button" class="btn danger" data-act="reset">Clear this device</button></div>
    </section>
  </div>`;
}

/* ---------- Backup ---------- */
function exportData() {
  const data = { app: "ai-engineer-journey", v: 1, exported_at: nowIso(), settings: state.settings, tasks: state.tasks, logs: state.logs, reviews: state.reviews };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `ai-engineer-journey-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Backup downloaded");
}
async function importFile(file) {
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "ai-engineer-journey" || typeof data.tasks !== "object") throw new Error("not a backup");
    if (!confirm("Replace the progress on this device with this backup?")) return;
    state.settings = { ...defaultState().settings, ...(data.settings || {}) };
    state.tasks = data.tasks || {}; state.logs = data.logs || {}; state.reviews = data.reviews || {};
    state.pending = []; state.meta.syncedUser = null; saveLocal();
    toast("Backup restored"); render();
    if (Cloud.session) Cloud.fullSync();
  } catch (e) { toast("That file isn't a tracker backup."); }
}
function resetLocal() {
  if (!confirm("Clear all progress on this device? If you use sync, your cloud copy is kept and will come back when you sync.")) return;
  const keep = state.meta.syncedUser; state = defaultState(); state.meta.syncedUser = keep; saveLocal();
  toast("This device was cleared"); render();
  if (Cloud.session) Cloud.fullSync();
}

/* ---------- Toast ---------- */
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- Events ---------- */
document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches(".task-chk")) { setTask(t.dataset.id, t.checked); rerenderKeepFocus(t.dataset.id); }
  else if (t.id === "import-file") { importFile(t.files[0]); t.value = ""; }
});
document.addEventListener("input", e => {
  if (e.target.id === "res-q") { ui.resQuery = e.target.value; const box = $("#res-list"); if (box) box.innerHTML = resListHTML(); }
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "qmin") {
    const f = b.closest("form"); f.querySelector('[name="minutes"]').value = b.dataset.min;
    f.querySelectorAll(".q").forEach(x => x.classList.toggle("on", x === b));
  } else if (act === "del-log") {
    const d = b.dataset.date;
    if (confirm(`Delete the log for ${fmtDateLong(d)}?`)) { delete state.logs[d]; saveLocal(); Cloud.queue("log:" + d); toast("Log deleted"); render(); }
  } else if (act === "filter") { ui.resArea = b.dataset.area; render(); }
  else if (act === "export") exportData();
  else if (act === "import") $("#import-file").click();
  else if (act === "reset") resetLocal();
  else if (act === "sync-now") Cloud.fullSync();
  else if (act === "sign-out") {
    if (confirm("Sign out on this device?")) Cloud.signOut();
  }
  else if (act === "sign-out-all") {
    if (confirm("Sign out on every device where you're signed in, including this one?")) Cloud.signOut({ scope: "global" });
  }
  else if (act === "auth-mode") { ui.authMode = b.dataset.mode; Cloud.message = ""; render(); }
  else if (act === "go-offline") { ui.offline = true; render(); }
  else if (act === "forgot") {
    const email = ((document.querySelector('form[data-form="auth"] [name="email"]') || {}).value || "").trim();
    if (!email) { toast("Enter your email first, then choose Forgot your password."); return; }
    ui.lastEmail = email;
    Cloud.resetPassword(email).then(() => toast("Check your email for a password reset link."))
      .catch(err => { Cloud.message = friendlyError(err); render(); });
  }
  else if (act === "edit-cloud") { ui.showCloudForm = true; render(); }
  else if (act === "cancel-cloud") { ui.showCloudForm = false; render(); }
  else if (act === "retry-cloud") Cloud.init();
  else if (act === "disconnect") {
    if (confirm("Turn sync off on this device? Your progress stays here and in the cloud.")) {
      if (Cloud.client) Cloud.client.auth.signOut().catch(() => {});
      Store.del(CLOUD_KEY); Cloud.init(); toast("Sync turned off on this device"); render();
    }
  }
});
document.addEventListener("submit", async e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f);
  if (kind === "log") {
    const date = fd.get("date");
    if (!isYmd(date) || date > todayStr()) { toast("Pick a date up to today."); return; }
    saveLog(date, { minutes: fd.get("minutes"), dsa: fd.get("dsa"), min: fd.get("min") === "on", note: fd.get("note") });
    toast(state.logs[date] ? `Log saved for ${fmtDateLong(date)}` : "Empty log removed");
    if (parseRoute().name === "log") location.hash = "#/log"; render();
  } else if (kind === "review") {
    saveReview(Number(f.dataset.week), fd.get("note")); toast("Weekly review saved"); render();
  } else if (kind === "start" || kind === "settings") {
    const start = fd.get("start");
    if (!isYmd(start)) { toast("Pick a valid start date."); return; }
    const patch = { name: String(fd.get("name") || "").trim().slice(0, 60), start, target: clamp(parseInt(fd.get("target"), 10) || 20, 1, 80) };
    if (kind === "settings") patch.dsaOffset = clamp(parseInt(fd.get("dsaOffset"), 10) || 0, 0, 2000);
    saveSettings(patch);
    toast(kind === "start" ? "Your plan has started. One week at a time." : "Plan settings saved");
    if (kind === "start") location.hash = "#/"; render();
  } else if (kind === "cloud") {
    const url = String(fd.get("url") || "").trim().replace(/\/+$/, ""); const key = String(fd.get("key") || "").trim();
    if (!/^https:\/\//.test(url)) { toast("The project URL should start with https://"); return; }
    if (isSecretKey(key)) { toast("That's a secret key. Use the anon or publishable key instead."); return; }
    Store.set(CLOUD_KEY, { url, key }); ui.showCloudForm = false;
    await Cloud.init(); render();
  } else if (kind === "auth") {
    const mode = (e.submitter && e.submitter.value) || "in";
    const email = String(fd.get("email") || "").trim(); const password = String(fd.get("password") || "");
    ui.lastEmail = email;
    if (mode === "up" && password !== String(fd.get("password2") || "")) { toast("The two passwords don't match."); return; }
    try {
      Cloud.message = "";
      if (mode === "up") {
        const r = await Cloud.signUp(email, password);
        if (r === "confirm") { ui.authMode = "in"; toast("Account created. Open the link in your email, then sign in."); }
        else toast("Account created and signed in");
      } else { await Cloud.signIn(email, password); toast("Signed in. Your progress is syncing."); }
      render();
    } catch (err) { Cloud.message = friendlyError(err); render(); }
  } else if (kind === "idle") {
    const m = parseInt(fd.get("idle"), 10);
    Idle.setMinutes(IDLE_OPTIONS.some(([v]) => v === m) ? m : IDLE_DEFAULT);
    toast(Idle.minutes() ? `This device will sign out after ${idleLabel(Idle.minutes())} without activity` : "Auto sign-out turned off on this device");
    render();
  } else if (kind === "newpass" || kind === "changepass") {
    const password = String(fd.get("password") || "");
    if (kind === "newpass" && password !== String(fd.get("password2") || "")) { toast("The two passwords don't match."); return; }
    try {
      await Cloud.changePassword(password);
      Cloud.message = ""; ui.recovery = false;
      if (kind === "newpass") history.replaceState(null, "", location.pathname + "#/");
      toast("Password updated"); f.reset(); render();
      if (kind === "newpass") Cloud.fullSync();
    } catch (err) { Cloud.message = friendlyError(err); if (kind === "changepass") toast(Cloud.message); render(); }
  }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
window.addEventListener("online", () => { if (Cloud.session) Cloud.fullSync(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Cloud.session && Date.now() - Cloud.lastSync > 60000) Cloud.fullSync();
});

/* ---------- Start ---------- */
buildIndex();
render();
Idle.start();
Cloud.init();
</script>
</body>
</html>
